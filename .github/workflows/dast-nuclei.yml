name: Nuclei - Vulnerability Scan

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL alvo para scan Nuclei'
        required: true
        default: 'https://silver-tribble-96v44prxj9x27vxw-3000.app.github.dev'

permissions:
  contents: read
  security-events: write

jobs:
  nuclei-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nuclei - Vulnerability Scan
        id: nuclei_scan
        uses: projectdiscovery/nuclei-action@v3
        with:
          args: -u ${{ github.event.inputs.target_url }}
          
      - name: GitHub Workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuclei.log
          path: nuclei.log

      - name: GitHub Security Dashboard Alerts update
        uses: github/codeql-action/upload-sarif@v3
        if: steps.nuclei_scan.outputs.sarif_exists == 'true'
        with:
          sarif_file: nuclei.sarif
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
