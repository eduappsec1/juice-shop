name: dast-zap-baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # -------------------------------------------------------
      # 1. Subir o OWASP Juice Shop
      # -------------------------------------------------------
      - name: Start OWASP Juice Shop
        run: |
          docker pull bkimminich/juice-shop:v20.2.0

          docker run -d \
            --name juice-shop \
            -p 3000:3000 \
            bkimminich/juice-shop:v20.2.0

      # -------------------------------------------------------
      # 2. Esperar a aplicação realmente ficar disponível
      # -------------------------------------------------------
      - name: Wait for Juice Shop
        shell: bash
        run: |
          echo "Waiting for Juice Shop..."

          for i in {1..60}; do

            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 5 \
              http://127.0.0.1:3000/ \
              > /dev/null; then

              echo "Juice Shop is ready!"
              exit 0

            fi

            echo "Attempt $i/60 - Juice Shop not ready yet..."
            sleep 2
          done

          echo "Juice Shop failed to start."
          echo ""
          echo "=== Docker containers ==="
          docker ps -a

          echo ""
          echo "=== Juice Shop logs ==="
          docker logs juice-shop || true

          exit 1

      # -------------------------------------------------------
      # 3. Teste simples antes do DAST
      # -------------------------------------------------------
      - name: Test application
        run: |
          curl -I http://127.0.0.1:3000/

      # -------------------------------------------------------
      # 4. DAST com OWASP ZAP
      # -------------------------------------------------------
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://127.0.0.1:3000/'
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-baseline-report

      # -------------------------------------------------------
      # 5. Cleanup
      # -------------------------------------------------------
      - name: Stop Juice Shop
        if: always()
        run: |
          docker rm -f juice-shop || true
