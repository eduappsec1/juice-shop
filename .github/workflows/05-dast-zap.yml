name: dast-zap-baseline

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-latest

    services:
      juice-shop:
        image: bkimminich/juice-shop:latest

        ports:
          - 3000:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Wait for Juice Shop
        run: |
          - name: Wait for Juice Shop
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 60 \
            --retry-delay 3 \
            --retry-connrefused \
            --retry-all-errors \
            http://127.0.0.1:3000/ \
            > /dev/null
            - name: OWASP ZAP Baseline Scan
              uses: zaproxy/action-baseline@v0.15.0
              with:
                target: 'http://127.0.0.1:3000/'

          # No showroom queremos primeiro mostrar
          # findings sem impedir a continuação.
          fail_action: false

          artifact_name: zap-baseline-report
